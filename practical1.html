<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard - Symbiosis Institute of Technology</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: linear-gradient(135deg, #b2dfdb, #c8e6c9); /* Light blue + light green */
      color: #fff;
      padding: 30px;
    }
    .container {
      max-width: 1000px;
      width: 95%;
      background: rgba(255, 255, 255, 0.85); /* Transparent white card */
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      color: #000;
    }
    h1 {
      text-align: center;
      color: #1a237e;
      margin-bottom: 5px;
    }
    h2 {
      text-align: center;
      color: #2e7d32;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #aaa;
      border-radius: 6px;
      font-size: 16px;
    }
    input:focus {
      border-color: #2e7d32;
      outline: none;
    }
    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #1a237e;
      color: #fff;
      border: none;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #2e7d32;
    }
    #dashboard {
      margin-top: 25px;
      padding: 20px;
      border: 2px solid #1a237e;
      border-radius: 8px;
      background: rgba(240, 249, 240, 0.9); /* Transparent dashboard section */
      color: #000;
    }
    #footer {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      color: #1a237e;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table, th, td {
      border: 1px solid #1a237e;
    }
    th, td {
      padding: 10px;
      text-align: center;
    }
    th {
      background: rgba(224, 242, 241, 0.9);
      color: #000;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Symbiosis Institute of Technology</h1>
  <div id="footer">Nagpur, Maharashtra</div>
  <h2>Student Portal Dashboard</h2>

  <label>Student Name:</label>
  <input type="text" id="studentName" placeholder="Enter student name">

  <label>PRN:</label>
  <input type="text" id="prn" placeholder="Enter PRN">

  <label>Phone Number:</label>
  <input type="text" id="phone" placeholder="Enter phone number">

  <label>Branch:</label>
  <input type="text" id="branch" placeholder="Enter branch">

  <label>Year:</label>
  <input type="text" id="year" placeholder="Enter year">

  <button onclick="addStudent()">Add Student</button>
  <button onclick="generateDashboard()">Generate Dashboard</button>

  <div id="dashboard"></div>
</div>

<script>
let students = [];
let branchCount = {};

function addStudent() {
  const studentName = document.getElementById("studentName").value;
  const prn = document.getElementById("prn").value;
  const phone = document.getElementById("phone").value;
  const branch = document.getElementById("branch").value;
  const year = document.getElementById("year").value;

  if (!studentName || !prn || !phone || !branch || !year) {
    alert("Please fill out all fields correctly.");
    return;
  }

  students.push({ studentName, prn, phone, branch, year });

  // Count branch totals
  if (branchCount[branch]) {
    branchCount[branch]++;
  } else {
    branchCount[branch] = 1;
  }

  // Clear inputs
  document.getElementById("studentName").value = "";
  document.getElementById("prn").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("branch").value = "";
  document.getElementById("year").value = "";
}

function generateDashboard() {
  if (students.length === 0) {
    alert("Please add at least one student.");
    return;
  }

  let dashboardHTML = `<h2>Student Information</h2><table><tr><th>#</th><th>Name</th><th>PRN</th><th>Phone</th><th>Branch</th><th>Year</th></tr>`;
  students.forEach((s, index) => {
    dashboardHTML += `<tr>
      <td>${index+1}</td>
      <td>${s.studentName}</td>
      <td>${s.prn}</td>
      <td>${s.phone}</td>
      <td>${s.branch}</td>
      <td>${s.year}</td>
    </tr>`;
  });
  dashboardHTML += "</table>";

  dashboardHTML += `<h2>Branch Totals</h2>`;
  for (const branch in branchCount) {
    dashboardHTML += `<p><b>${branch}:</b> ${branchCount[branch]} student(s)</p>`;
  }

  dashboardHTML += `<h3>Total Students: ${students.length}</h3>`;

  document.getElementById("dashboard").innerHTML = dashboardHTML;
}
</script>

</body>
</html>
