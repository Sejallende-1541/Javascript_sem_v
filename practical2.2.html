<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shopping Paradise</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f5f5;
        }
        header {
            background: linear-gradient(90deg, #0b1d3a, #1f4a7a, #6c7a89, #f5e9d7);
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .product {
            border: 1px solid #ddd;
            background: #f5e9d7;
            margin: 15px;
            padding: 15px;
            width: 250px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .product h3 {
            color: #1f4a7a;
        }
        .product button {
            background: #0b1d3a;
            border: none;
            padding: 10px 15px;
            margin-top: 10px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
        }
        .product button:hover {
            background: #1f4a7a;
        }
        #bill {
            background: #fff;
            margin: 30px auto;
            padding: 20px;
            width: 600px;
            border: 2px solid #4CAF50;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        #bill h2 {
            margin-top: 0;
            text-align: center;
            color: #0b1d3a;
            font-size: 24px;
        }
        #bill table {
            width: 100%;
            border-collapse: collapse;
        }
        #bill table, #bill th, #bill td {
            border: 1px solid #ccc;
        }
        #bill th, #bill td {
            padding: 10px;
            text-align: center;
        }
        #total {
            font-weight: bold;
            color: #4CAF50;
        }
        #gst {
            font-weight: bold;
            color: #d9534f;
        }
        #grandTotal {
            font-weight: bold;
            color: #1f4a7a;
            font-size: 20px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            border-top: 2px dashed #333;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <header>
        Shopping Paradise
    </header>

    <!-- Customer Name Input -->
    <div style="text-align:center; margin:20px;">
        <label>Enter Customer Name: 
            <input type="text" id="customerName" placeholder="Customer Name">
        </label>
    </div>

    <div class="container">
        <!-- Products -->
        <div class="product">
            <h3>Shirt</h3>
            <p>Price: ₹500</p>
            <label>Qty: <input type="number" id="qtyShirt" value="1" min="1"></label><br>
            <button onclick="addToBill('Shirt', 500, document.getElementById('qtyShirt').value)">Add</button>
        </div>

        <div class="product">
            <h3>Jeans</h3>
            <p>Price: ₹1200</p>
            <label>Qty: <input type="number" id="qtyJeans" value="1" min="1"></label><br>
            <button onclick="addToBill('Jeans', 1200, document.getElementById('qtyJeans').value)">Add</button>
        </div>

        <div class="product">
            <h3>Necklace</h3>
            <p>Price: ₹3000</p>
            <label>Qty: <input type="number" id="qtyNecklace" value="1" min="1"></label><br>
            <button onclick="addToBill('Necklace', 3000, document.getElementById('qtyNecklace').value)">Add</button>
        </div>

        <div class="product">
            <h3>Ring</h3>
            <p>Price: ₹1500</p>
            <label>Qty: <input type="number" id="qtyRing" value="1" min="1"></label><br>
            <button onclick="addToBill('Ring', 1500, document.getElementById('qtyRing').value)">Add</button>
        </div>

        <div class="product">
            <h3>Mobile</h3>
            <p>Price: ₹15000</p>
            <label>Qty: <input type="number" id="qtyMobile" value="1" min="1"></label><br>
            <button onclick="addToBill('Mobile', 15000, document.getElementById('qtyMobile').value)">Add</button>
        </div>

        <div class="product">
            <h3>Laptop</h3>
            <p>Price: ₹45000</p>
            <label>Qty: <input type="number" id="qtyLaptop" value="1" min="1"></label><br>
            <button onclick="addToBill('Laptop', 45000, document.getElementById('qtyLaptop').value)">Add</button>
        </div>
    </div>

    <!-- Bill Section -->
    <div id="bill">
        <h2>Bill Details</h2>
        <p id="customerLine" style="text-align:center; font-weight:bold;"></p>
        <table id="billTable">
            <tr>
                <th>Item</th>
                <th>Qty</th>
                <th>Price</th>
                <th>Subtotal</th>
            </tr>
        </table>
        <p id="total">Total: ₹0</p>
        <p id="gst">GST (1.8%): ₹0</p>
        <p id="grandTotal">Grand Total: ₹0</p>
        <div class="footer" id="footerMessage">
            <!-- Thank you message will appear here -->
        </div>
    </div>

    <script>
        let total = 0;

        function addToBill(item, price, qty) {
            qty = parseInt(qty);
            let subtotal = price * qty;

            // Add row to bill table
            let table = document.getElementById("billTable");
            let row = table.insertRow();
            row.insertCell(0).textContent = item;
            row.insertCell(1).textContent = qty;
            row.insertCell(2).textContent = "₹" + price;
            row.insertCell(3).textContent = "₹" + subtotal;

            // Update totals
            total += subtotal;
            let gst = total * 0.018;
            let grandTotal = total + gst;

            document.getElementById("total").textContent = "Total: ₹" + total.toFixed(2);
            document.getElementById("gst").textContent = "GST (1.8%): ₹" + gst.toFixed(2);
            document.getElementById("grandTotal").textContent = "Grand Total: ₹" + grandTotal.toFixed(2);

            // Show customer name on bill
            let name = document.getElementById("customerName").value;
            if(name.trim() !== "") {
                document.getElementById("customerLine").textContent = "Customer Name: " + name;
                document.getElementById("footerMessage").innerHTML = "<p><b>Thank you " + name + " for shopping with us.</b></p><p>Visit Again</p>";
            }
        }
    </script>
</body>
</html>
