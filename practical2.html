<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multi-Item E-Receipt</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7f6;
    }
    .container {
      max-width: 800px;
      width: 95%;
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    h2 {
      text-align: center;
      color: #2e7d32; /* Green heading */
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #aaa;
      border-radius: 6px;
    }
    input:focus {
      border-color: #2e7d32;
      outline: none;
    }
    button {
      margin-top: 15px;
      padding: 12px 20px;
      background: #2e7d32; /* Green button */
      color: #fff;
      border: none;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s ease;
    }
    button:hover {
      background: #1b5e20;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    table, th, td {
      border: 1px solid #2e7d32;
    }
    th, td {
      padding: 10px;
      text-align: center;
      color: #1b5e20; /* Green font */
    }
    th {
      background: #e8f5e9;
    }
    #receipt {
      margin-top: 25px;
      padding: 20px;
      border: 2px solid #2e7d32;
      border-radius: 8px;
      background: #e8f5e9;
      color: #1b5e20;
    }
    #receipt h3 {
      text-align: right;
      font-size: 18px;
      margin-top: 15px;
      color: #2e7d32;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Multi-Item E-Receipt</h2>
  
  <label>Customer Name:</label>
  <input type="text" id="customerName" placeholder="Enter customer name">

  <h3>Add Product</h3>
  <label>Product Name:</label>
  <input type="text" id="productName" placeholder="Enter product name">

  <label>Price (₹):</label>
  <input type="number" id="price" placeholder="Enter price">

  <label>Quantity:</label>
  <input type="number" id="quantity" placeholder="Enter quantity">

  <button onclick="addItem()">Add Item</button>
  <button onclick="generateReceipt()">Generate Receipt</button>

  <div id="cart"></div>
  <div id="receipt"></div>
</div>

<script>
let items = [];

function addItem() {
  const productName = document.getElementById("productName").value;
  const price = parseFloat(document.getElementById("price").value);
  const quantity = parseInt(document.getElementById("quantity").value);

  if (!productName || isNaN(price) || price <= 0 || isNaN(quantity) || quantity <= 0) {
    alert("Please enter valid product details.");
    return;
  }

  // GST per item
  const subtotal = price * quantity;
  const gstAmount = subtotal * 0.018;
  const total = subtotal + gstAmount;

  items.push({ productName, price, quantity, subtotal, gstAmount, total });

  displayCart();

  // Clear inputs
  document.getElementById("productName").value = "";
  document.getElementById("price").value = "";
  document.getElementById("quantity").value = "";
}

function displayCart() {
  let cartHTML = "<h3>Items Added</h3><table><tr><th>Name</th><th>Price</th><th>Qty</th><th>Subtotal</th><th>GST (18%)</th><th>Total</th></tr>";
  items.forEach(item => {
    cartHTML += `<tr>
      <td>${item.productName}</td>
      <td>₹${item.price.toFixed(2)}</td>
      <td>${item.quantity}</td>
      <td>₹${item.subtotal.toFixed(2)}</td>
      <td>₹${item.gstAmount.toFixed(2)}</td>
      <td>₹${item.total.toFixed(2)}</td>
    </tr>`;
  });
  cartHTML += "</table>";
  document.getElementById("cart").innerHTML = cartHTML;
}

function generateReceipt() {
  const customerName = document.getElementById("customerName").value;
  if (!customerName || items.length === 0) {
    alert("Please enter customer name and add at least one item.");
    return;
  }

  const grandSubtotal = items.reduce((sum, item) => sum + item.subtotal, 0);
  const grandGST = items.reduce((sum, item) => sum + item.gstAmount, 0);
  const grandTotal = items.reduce((sum, item) => sum + item.total, 0);

  document.getElementById("receipt").innerHTML = `
    <h2>E-Receipt</h2>
    <p><b>Customer:</b> ${customerName}</p>
    <p><b>Total Subtotal:</b> ₹${grandSubtotal.toFixed(2)}</p>
    <p><b>Total GST (18%):</b> ₹${grandGST.toFixed(2)}</p>
    <h3>Grand Total: ₹${grandTotal.toFixed(2)}</h3>
  `;
}
</script>

</body>
</html>
